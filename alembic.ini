[alembic]
script_location = %(here)s/migrations
# Lets migrations/env.py import the `app` package when run via the `alembic` console script.
prepend_sys_path = .
path_separator = os
# Database URL is not configured here: migrations/env.py builds it from POSTGRES_* settings
# in app.config, and tests pass their own connection to target the test database.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
