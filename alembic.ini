[alembic]
script_location = migrations
# Lets migrations/env.py import the `app` package when run via the `alembic` console script.
prepend_sys_path = .
# Intentionally blank: migrations/env.py builds the URL from POSTGRES_* settings in app.config.
# Tests set this option programmatically to point at the test database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
