# Configuration comes from .env (copy .env.example and fill it in). Nothing is defaulted here.
services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: true
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # No host port published: the api and the tests reach Postgres over the compose network.
    healthcheck:
      # -h localhost forces a TCP check. During first-time init Postgres runs a temporary
      # socket-only server, so this only passes once init scripts (test DB creation) are done.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: true
    ports:
      - "${API_PORT:?API_PORT is not set - copy .env.example to .env and fill it in}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
